name: Build Rust Binary for Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Build Rust Binary
        run: |
          # 1. 正常编译
          cargo build --release --target aarch64-unknown-linux-musl
          
          # 2. 核心：把默认的 dns-report 重命名为 AdguardHomeReport
          mv target/aarch64-unknown-linux-musl/release/dns-report AdguardHomeReport

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 编译产物 v1.0.${{ github.run_number }}
          # 3. 上传重命名后的文件
          files: AdguardHomeReport