name: Build Rust Binary for Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build Rust Binary
        run: |
          cargo build --release --locked --target aarch64-unknown-linux-musl
          ls -lh target/aarch64-unknown-linux-musl/release/

      - name: Verify artifact
        run: |
          test -x target/aarch64-unknown-linux-musl/release/AdguardHomeReport
          file target/aarch64-unknown-linux-musl/release/AdguardHomeReport

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 编译产物 v1.0.${{ github.run_number }}
          files: target/aarch64-unknown-linux-musl/release/AdguardHomeReport