name: Build Rust Binary for Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Install musl-tools and aarch64 gcc
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu

      - name: Build Rust Binary (Static ARM64)
        run: |
          # 设置交叉编译器环境变量，确保底层依赖能正确编译
          export CC_aarch64_unknown_linux_musl=aarch64-linux-gnu-gcc
          export AR_aarch64_unknown_linux_musl=aarch64-linux-gnu-ar
          cargo build --release --target aarch64-unknown-linux-musl

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dns-report-binary
          path: target/aarch64-unknown-linux-musl/release/dns-report