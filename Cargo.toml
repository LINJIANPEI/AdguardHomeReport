[package]
name = "adguard-home-report"      # 保持小写短横线，避免 non-snake-case 警告
version = "0.1.0"
edition = "2021"

[[bin]]
name = "AghReport"        # 二进制名，大写可以
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
ureq = { version = "2.9", default-features = false }
serde_json = "1.0"
urlencoding = "2.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"