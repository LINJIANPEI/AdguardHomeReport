[package]
name = "dns-report"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
# 修改了这一行：禁用默认特性，开启 rustls-tls
reqwest = { version = "0.11", default-features = false, features = ["cookies", "json", "rustls-tls"] }
serde_json = "1.0"
urlencoding = "2.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"