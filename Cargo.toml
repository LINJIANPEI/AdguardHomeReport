[package]
name = "dns-report"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7.5"
tokio = { version = "1.37.0", features = ["full"] }
reqwest = { version = "0.11.27", default-features = false, features = ["cookies", "json", "rustls-tls"] }
serde_json = "1.0.116"
urlencoding = "2.1.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"