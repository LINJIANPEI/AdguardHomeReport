[package]
name = "dns-report"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
# 核心：禁用默认特性，只开启 cookies 和 json。这能彻底甩掉 openssl 和 rustls，避免交叉编译报错
reqwest = { version = "0.11", default-features = false, features = ["cookies", "json"] }
serde_json = "1.0"
urlencoding = "2.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"